<div class="min-h-screen bg-gray-950 px-4 sm:px-8 py-12">
  <div class="max-w-6xl mx-auto">
    <header class="mb-8">
      <h1 class="text-3xl font-bold text-white mb-2">Videos</h1>
      <p class="text-gray-400">
        Tech talks on backend engineering and distributed systems.
      </p>
    </header>

    @if (allTags().length > 0) {
      <div class="mb-6">
        <app-tag-filter
          [availableTags]="allTags()"
          (selectedTagsChange)="onSelectedTagsChange($event)"
        />
      </div>
    }

    <div class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-6">
      @for (video of filteredVideos(); track video.id) {
        <app-video-card [video]="video" />
      }
    </div>

    @if (manifest() && manifest()!.totalPages > 1) {
      <nav
        class="mt-10 flex flex-wrap items-center justify-center gap-2"
        aria-label="Pagination"
      >
        <button
          type="button"
          class="text-xs px-3 py-1 rounded-full bg-gray-700 text-gray-200 hover:bg-gray-600 disabled:opacity-40 disabled:cursor-not-allowed transition"
          [disabled]="currentPage() === 1"
          (click)="goToPage(currentPage() - 1)"
        >
          ← Prev
        </button>
        @for (n of pageNumbers(); track n) {
          <button
            type="button"
            class="text-xs px-3 py-1 rounded-full transition"
            [class.bg-blue-500]="n === currentPage()"
            [class.text-white]="n === currentPage()"
            [class.bg-gray-700]="n !== currentPage()"
            [class.text-gray-300]="n !== currentPage()"
            [class.hover:bg-gray-600]="n !== currentPage()"
            (click)="goToPage(n)"
          >
            {{ n }}
          </button>
        }
        <button
          type="button"
          class="text-xs px-3 py-1 rounded-full bg-gray-700 text-gray-200 hover:bg-gray-600 disabled:opacity-40 disabled:cursor-not-allowed transition"
          [disabled]="currentPage() === manifest()!.totalPages"
          (click)="goToPage(currentPage() + 1)"
        >
          Next →
        </button>
      </nav>
    }
  </div>
</div>
