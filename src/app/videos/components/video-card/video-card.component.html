<article
  class="bg-gray-500 bg-opacity-30 backdrop-blur rounded-2xl overflow-hidden flex flex-col h-full transition hover:-translate-y-0.5 hover:shadow-xl"
>
  <div class="relative aspect-video w-full bg-black">
    @if (!isPlaying()) {
      <button
        type="button"
        (click)="play()"
        class="group absolute inset-0 w-full h-full"
        [attr.aria-label]="'Play ' + video.title"
      >
        <img
          ngSrc="https://img.youtube.com/vi/{{ video.id }}/maxresdefault.jpg"
          alt="{{ video.title }} thumbnail"
          width="640"
          height="360"
          class="w-full h-full object-cover"
        />
        <span
          class="absolute inset-0 flex items-center justify-center bg-black/20 group-hover:bg-black/40 transition-colors"
        >
          <mat-icon
            class="text-white !w-auto !h-auto !text-7xl drop-shadow-lg transition-transform group-hover:scale-110"
          >
            play_circle_filled
          </mat-icon>
        </span>
      </button>
    } @else {
      <iframe
        [src]="embedUrl()"
        title="{{ video.title }}"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen
        class="w-full h-full border-0"
      ></iframe>
    }
  </div>

  <div class="p-4 flex flex-col gap-2 flex-1">
    <h3 class="text-white font-bold text-base">{{ video.title }}</h3>

    @if (video.description) {
      <p class="text-gray-300 text-sm">{{ video.description }}</p>
    }

    @if (video.tags && video.tags.length > 0) {
      <div class="flex flex-wrap gap-1">
        @for (tag of video.tags; track tag) {
          <span class="text-xs bg-gray-700 text-gray-300 px-2 py-0.5 rounded">
            {{ tag }}
          </span>
        }
      </div>
    }

    <a
      href="https://www.youtube.com/watch?v={{ video.id }}"
      target="_blank"
      rel="noopener noreferrer"
      class="text-blue-400 text-xs hover:underline inline-flex items-center gap-1 mt-auto pt-2 self-start"
    >
      <mat-icon class="!w-4 !h-4 !text-base !leading-none">
        open_in_new
      </mat-icon>
      Open in YouTube
    </a>
  </div>
</article>
